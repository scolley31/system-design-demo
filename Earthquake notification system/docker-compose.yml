# 本地驗證 production code path（Postgres + Redis Streams）。
# 與本機 uvicorn 啟動互不影響；需手動 `docker compose up` 才生效。
# 注意：
#  - LOCATION_TABLE 不設 → user_location 走 Postgres（非 DynamoDB），本地即可驗證。
#  - 用 uvicorn 單一 process（SSE realtime hub 需單 process；見 Dockerfile 註解）。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quake
      POSTGRES_PASSWORD: quake
      POSTGRES_DB: quake
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quake"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8010:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://quake:quake@db:5432/quake
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

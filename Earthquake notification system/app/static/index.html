<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Earthquake Notification System — Demo</title>
  <script src="/static/h3-js.umd.js"></script>
  <style>
    :root { --bg:#0f1420; --card:#1a2130; --line:#2b3446; --fg:#e7ecf3; --muted:#93a0b4; --accent:#ff6b4a; --ok:#3fb950; --warn:#d29922; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
    header h1 { font-size:16px; margin:0; font-weight:600; }
    .tag { font-size:12px; color:var(--muted); }
    .wrap { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px 20px; max-width:1100px; margin:0 auto; }
    @media (max-width:820px){ .wrap { grid-template-columns:1fr; } }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
    .card h2 { font-size:13px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
    input { width:100%; padding:8px 10px; background:#0d121c; border:1px solid var(--line); border-radius:6px; color:var(--fg); font-size:13px; }
    .row { display:flex; gap:10px; }
    .row > div { flex:1; }
    button { margin-top:12px; padding:9px 14px; background:var(--accent); color:#fff; border:0; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; }
    button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
    button:active { transform:translateY(1px); }
    .status { font-size:12px; margin-top:8px; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
    .dot.on { background:var(--ok); } .dot.off { background:var(--muted); }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--muted); word-break:break-all; }
    .feed { margin-top:10px; max-height:340px; overflow:auto; display:flex; flex-direction:column; gap:8px; }
    .alert { border:1px solid var(--accent); background:rgba(255,107,74,.08); border-radius:8px; padding:10px 12px; animation:pop .25s ease; }
    @keyframes pop { from{opacity:0; transform:scale(.97);} to{opacity:1; transform:scale(1);} }
    .alert b { color:var(--accent); }
    .empty { color:var(--muted); font-size:12px; padding:8px 0; }
    table { width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
    th,td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:500; }
    .s-VENDOR_ACCEPTED{color:var(--ok);} .s-CANCELLED_SUPERSEDED{color:var(--warn);} .s-ENQUEUED,.s-ATTEMPTED{color:var(--muted);} .s-FAILED{color:var(--accent);}
    .hint { font-size:11px; color:var(--muted); margin-top:6px; }
  </style>
</head>
<body>
  <header>
    <span style="font-size:20px">🚨</span>
    <h1>Earthquake Notification System</h1>
    <span class="tag">demo · 前端算 H3 cell 直送 · SSE 即時送達</span>
  </header>

  <div class="wrap">
    <!-- 裝置：設定 + 位置 + 即時通知 -->
    <div class="card">
      <h2>📱 這台裝置</h2>
      <div class="mono">device_id: <span id="did"></span></div>
      <div class="row">
        <div><label>震度門檻 magnitude_min</label><input id="mag" type="number" step="0.1" value="4.0"></div>
        <div><label>距離 distance_km</label><input id="dist" type="number" step="1" value="50"></div>
      </div>
      <div class="row">
        <div><label>緯度 lat</label><input id="lat" type="number" step="0.01" value="25.03"></div>
        <div><label>經度 long</label><input id="lng" type="number" step="0.01" value="121.56"></div>
      </div>
      <div class="mono">H3 cell（前端 latLngToCell 算出）: <span id="cell">—</span></div>
      <button id="register">註冊 / 更新（設定 + 位置）</button>
      <div class="status"><span id="dot" class="dot off"></span><span id="conn">未連線</span></div>
      <div class="hint">開多個瀏覽器分頁 = 多台裝置，各自設不同門檻/座標。</div>

      <h2 style="margin-top:18px">🔔 即時通知（SSE）</h2>
      <div id="feed" class="feed"><div class="empty">尚無通知。觸發一場符合條件的地震試試。</div></div>
    </div>

    <!-- 觸發地震 + outbox -->
    <div class="card">
      <h2>🌋 觸發地震（模擬事件來源）</h2>
      <div class="row">
        <div><label>緯度 lat</label><input id="eqlat" type="number" step="0.01" value="25.03"></div>
        <div><label>經度 long</label><input id="eqlng" type="number" step="0.01" value="121.56"></div>
      </div>
      <div class="row">
        <div><label>震度 magnitude</label><input id="eqmag" type="number" step="0.1" value="6.0"></div>
        <div><label>alert_id</label><input id="eqid" value="eq-demo"></div>
        <div><label>version</label><input id="eqver" type="number" step="1" value="1"></div>
      </div>
      <button id="trigger">觸發地震</button>
      <button id="bump" class="ghost">version +1 再觸發（升級覆蓋）</button>
      <div id="eqresult" class="hint"></div>

      <h2 style="margin-top:18px">📒 這台裝置的 Outbox</h2>
      <button id="refresh" class="ghost">重新整理</button>
      <table><thead><tr><th>alert_id</th><th>ver</th><th>channel</th><th>status</th></tr></thead>
        <tbody id="outbox"><tr><td colspan="4" class="empty">—</td></tr></tbody></table>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
// device_id 每個分頁一個（存 sessionStorage，重整不變、新分頁不同）
let deviceId = sessionStorage.getItem("device_id");
if (!deviceId) { deviceId = "dev-" + Math.random().toString(36).slice(2, 10); sessionStorage.setItem("device_id", deviceId); }
$("did").textContent = deviceId;

let H3_RES = 5;  // 會被 /config/meta 覆寫，確保前後端一致
fetch("/api/v1/config/meta").then(r=>r.json()).then(m=>{ H3_RES = m.h3_res; recompCell(); }).catch(()=>{});

function recompCell() {
  const lat = parseFloat($("lat").value), lng = parseFloat($("lng").value);
  if (isNaN(lat) || isNaN(lng)) return null;
  const cell = h3.latLngToCell(lat, lng, H3_RES);  // 前端算 cell（server 不換算）
  $("cell").textContent = cell;
  return cell;
}
$("lat").addEventListener("input", recompCell);
$("lng").addEventListener("input", recompCell);

async function api(path, body) {
  const r = await fetch(path, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.detail || r.status);
  return data;
}

$("register").onclick = async () => {
  const cell = recompCell();
  if (!cell) { alert("座標無效"); return; }
  await api("/api/v1/alerts/configuration", { device_id:deviceId, magnitude_min:parseFloat($("mag").value), distance_km:parseFloat($("dist").value) });
  await api("/api/v1/alerts/user_location", { device_id:deviceId, cell });
  connectSSE();
  loadOutbox();
};

// ---- SSE ----
let es = null;
function connectSSE() {
  if (es) es.close();
  es = new EventSource(`/api/v1/stream?device_id=${encodeURIComponent(deviceId)}`);
  es.addEventListener("connected", () => { $("dot").className="dot on"; $("conn").textContent="已連線（等待通知）"; });
  es.addEventListener("alert", e => { addAlert(JSON.parse(e.data)); loadOutbox(); });
  es.onerror = () => { $("dot").className="dot off"; $("conn").textContent="連線中斷，重試中…"; };
}
function addAlert(a) {
  const feed = $("feed");
  const empty = feed.querySelector(".empty"); if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "alert";
  div.innerHTML = `<b>地震警報 M${a.magnitude}</b> · ${a.alert_id} v${a.version}<br>
    <span class="mono">震央 (${a.lat}, ${a.long}) · 距你約 ${a.distance_km} km · 影響半徑 ${a.radius_km} km</span>`;
  feed.prepend(div);
}

// ---- 觸發地震 ----
async function fire() {
  try {
    const res = await api("/api/v1/earthquakes", {
      lat:parseFloat($("eqlat").value), long:parseFloat($("eqlng").value),
      magnitude:parseFloat($("eqmag").value), alert_id:$("eqid").value || null,
      version:parseInt($("eqver").value) || 1,
    });
    $("eqresult").textContent = `已觸發 ${res.alert_id} v${res.version} · cells=${res.cells} 候選=${res.candidates} 命中=${res.targeted} 送出=${res.enqueued}${res.stale?" (舊版本被 drop)":""}`;
    loadOutbox();
  } catch(e){ $("eqresult").textContent = "錯誤：" + e.message; }
}
$("trigger").onclick = fire;
$("bump").onclick = () => { $("eqver").value = (parseInt($("eqver").value)||1) + 1; fire(); };

// ---- outbox ----
async function loadOutbox() {
  const r = await fetch(`/api/v1/notifications?device_id=${encodeURIComponent(deviceId)}`);
  const rows = await r.json();
  const tb = $("outbox");
  if (!rows.length) { tb.innerHTML = `<tr><td colspan="4" class="empty">尚無紀錄</td></tr>`; return; }
  tb.innerHTML = rows.map(x => `<tr><td class="mono">${x.alert_id}</td><td>${x.version}</td><td>${x.channel}</td><td class="s-${x.status}">${x.status}</td></tr>`).join("");
}
$("refresh").onclick = loadOutbox;
</script>
</body>
</html>

# 本地部署版（= 正式版 code path）：etcd + DynamoDB Local + 2 pub/sub + 2 gateway + nginx
#
#   docker compose up --build          → http://localhost:8030/
#   docker compose stop pubsub-1       → graceful（SIGTERM → revoke lease → shard 立刻轉移）
#   docker compose kill pubsub-1       → hard（SIGKILL，等 lease TTL 5s 過期才轉移）
#   docker compose start pubsub-1      → 重新加入，rebalance 拿回一半 shard
#
# port 避開同 repo 其他 demo（8000/8010/8020、5432-5434、6379-6381）。
x-app: &app
  build: .
  image: messenger-app:local
  environment: &app-env
    ETCD_URL: http://etcd:2379
    DYNAMO_TABLE_PREFIX: messenger-local-
    DYNAMO_ENDPOINT: http://dynamodb:8000
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    AWS_DEFAULT_REGION: us-east-1
    NUM_SHARDS: "16"
    LEASE_TTL_S: "5"
    ALLOW_DEBUG: "1"

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    ports: ["23790:2379"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 20

  dynamodb:
    image: amazon/dynamodb-local:2.5.3
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["8101:8000"]

  init-tables:          # 一次性建表（app 本身沒有 CreateTable 權限，與正式版一致）
    <<: *app
    command: ["python", "-m", "app.tools.ensure_tables"]
    restart: "no"
    depends_on: [dynamodb]
    healthcheck:
      disable: true

  pubsub-1:
    <<: *app
    environment:
      <<: *app-env
      ROLE: pubsub
      NODE_ID: pubsub-1
      PORT: "8041"
      ADVERTISE_WS: ws://pubsub-1:8041/internal/ws
      ADVERTISE_HTTP: http://pubsub-1:8041
    ports: ["8041:8041"]
    restart: "no"       # 被 kill 後保持掛掉，方便觀察 failover
    depends_on:
      etcd: {condition: service_healthy}
      init-tables: {condition: service_completed_successfully}

  pubsub-2:
    <<: *app
    environment:
      <<: *app-env
      ROLE: pubsub
      NODE_ID: pubsub-2
      PORT: "8042"
      ADVERTISE_WS: ws://pubsub-2:8042/internal/ws
      ADVERTISE_HTTP: http://pubsub-2:8042
    ports: ["8042:8042"]
    restart: "no"
    depends_on:
      etcd: {condition: service_healthy}
      init-tables: {condition: service_completed_successfully}

  gateway-1:
    <<: *app
    environment:
      <<: *app-env
      ROLE: gateway
      NODE_ID: gw-1
      PORT: "8031"
    ports: ["8031:8031"]
    restart: unless-stopped
    depends_on:
      etcd: {condition: service_healthy}
      init-tables: {condition: service_completed_successfully}

  gateway-2:
    <<: *app
    environment:
      <<: *app-env
      ROLE: gateway
      NODE_ID: gw-2
      PORT: "8032"
    ports: ["8032:8032"]
    restart: unless-stopped
    depends_on:
      etcd: {condition: service_healthy}
      init-tables: {condition: service_completed_successfully}

  nginx:                # 對外入口：/ws 依 least_conn 分到兩台 gateway；/gw1 /gw2 指定 gateway（demo 用）
    image: nginx:1.27-alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8030:80"]
    depends_on: [gateway-1, gateway-2]

# WebSocket 反向代理：Upgrade / Connection header 一定要轉，否則 handshake 會被當成一般 HTTP。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 用 Docker 內建 DNS 動態解析（resolve 參數需 nginx ≥ 1.27.3）：gateway 容器重建換 IP 時不會 502
resolver 127.0.0.11 valid=5s ipv6=off;

upstream gateways {
    zone gateways 64k;
    least_conn;                 # 長連線用 least_conn 比 round-robin 平均
    server gateway-1:8031 max_fails=1 fail_timeout=5s resolve;
    server gateway-2:8032 max_fails=1 fail_timeout=5s resolve;
}
upstream gw1 { zone gw1 64k; server gateway-1:8031 resolve; }
upstream gw2 { zone gw2 64k; server gateway-2:8032 resolve; }

server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;   # 長連線；app 每 20s ping 一次
    proxy_send_timeout 3600s;

    location /ws      { proxy_pass http://gateways; }
    location /gw1/    { proxy_pass http://gw1/; }   # /gw1/ws → gateway-1 的 /ws；/gw1/api/cluster 亦同
    location /gw2/    { proxy_pass http://gw2/; }
    location /        { proxy_pass http://gateways; }
}
